name: 'Deploy PR Stack with Helm'
description: 'Deploys a Laravel PR stack to Kubernetes using Helm'

inputs:
  pr-number:
    description: 'Pull request number. Used to post the deployment comment on the PR and, unless stack-id is set, as the stack identity. Omit for PR-independent dev stacks (pass stack-id instead).'
    required: false
    default: ''
  stack-id:
    description: 'Stable stack identity used in the release name, hostname, and pr-number label (e.g. a PR number like "123", or a dev-stack slug like "dev-authfix"). Defaults to pr-number when omitted, so existing PR-stack callers are unaffected.'
    required: false
    default: ''
  image-tag:
    description: 'Docker image tag to deploy. If omitted, uses the tag already set in the values file.'
    required: false
    default: ''
  app-name:
    description: 'Application name (e.g., leads, dashboard)'
    required: true
  cloudformation-stack-name:
    description: 'CloudFormation stack name to query for IAM role ARN'
    required: true
  aws-account:
    description: 'AWS account name'
    required: false
    default: 'bisnow'
  eks-cluster:
    description: 'EKS cluster name'
    required: false
    default: 'bisnow-non-prod-eks'
  namespace:
    description: 'Kubernetes namespace'
    required: true
  helm-chart-version:
    description: 'Helm chart version'
    required: false
    default: '1'
  values-file-path:
    description: 'Path to Helm values file'
    required: false
    default: '.k8s/pr/values.yaml'
  ecr-registry:
    description: 'ECR registry URL'
    required: false
    default: '560285300220.dkr.ecr.us-east-1.amazonaws.com'
  kustomization-path:
    description: 'Path to kustomization directory containing sealed secrets'
    required: false
    default: '.k8s/pr'
  # Extra Helm --set overrides (space-separated, e.g. "externalDatabase.enabled=true mysql.enabled=false")
  helm-set-values:
    description: 'Additional Helm --set overrides to apply at deploy time (space-separated key=value pairs).'
    required: false
    default: ''
  # External database configuration
  external-database-host:
    description: 'External database host (e.g., pr-123-mysql.biscred-db.svc.cluster.local). If set, DB_HOST values will be configured.'
    required: false
    default: ''
  # Deploy reliability configuration
  atomic:
    description: |
      Run `helm upgrade --install` with `--atomic --cleanup-on-fail`. When true (default),
      a failed deploy rolls back automatically instead of leaving the release in a
      `pending-upgrade` state that blocks subsequent runs. Set to 'false' per-run if you
      need the crashed pods to remain in-cluster for kubectl inspection.
    required: false
    default: 'true'
  sealed-secrets-timeout:
    description: 'Seconds to wait for the sealed-secrets controller to materialize each target Secret after kubectl apply.'
    required: false
    default: '60'
  # Connection test configuration
  skip-connection-tests:
    description: 'Skip database and Redis connection tests'
    required: false
    default: 'false'
  skip-redis-test:
    description: 'Skip Redis connection test (for apps using file-based cache)'
    required: false
    default: 'false'
  app-id:
    description: 'GitHub App ID for posting a PR comment with the deployed URL. If omitted, no comment is posted.'
    required: false
    default: ''
  private-key:
    description: 'GitHub App private key for posting a PR comment with the deployed URL.'
    required: false
    default: ''

outputs:
  app-url:
    description: 'The deployed application URL'
    value: ${{ steps.get-url.outputs.app-url }}

runs:
  using: 'composite'
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.head_ref || github.ref_name }}

    - name: Resolve stack identity
      id: stack-id
      shell: bash
      env:
        STACK_ID_INPUT: ${{ inputs.stack-id }}
        PR_NUMBER_INPUT: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail

        # The stack identity drives the release name, hostname, and pr-number
        # label. It defaults to the PR number so existing PR-stack callers are
        # unchanged; dev stacks pass an explicit non-PR slug via stack-id.
        STACK_ID="${STACK_ID_INPUT:-}"
        if [ -z "${STACK_ID}" ]; then
          STACK_ID="${PR_NUMBER_INPUT:-}"
        fi
        if [ -z "${STACK_ID}" ]; then
          echo "ERROR: one of stack-id or pr-number must be provided."
          exit 1
        fi

        # The identity flows into the release name and the pr-number label, so it
        # must be a valid Kubernetes label value: [A-Za-z0-9._-], <=63 chars,
        # start/end alphanumeric.
        if ! printf '%s' "${STACK_ID}" | grep -qE '^[A-Za-z0-9]([A-Za-z0-9._-]{0,61}[A-Za-z0-9])?$'; then
          echo "ERROR: stack identity '${STACK_ID}' is not a valid label value (allowed: alphanumerics, '.', '_', '-'; <=63 chars; must start and end alphanumeric)."
          exit 1
        fi

        # Publish for later steps: $GITHUB_ENV so bash steps see $STACK_ID directly,
        # plus an output for steps that prefer explicit env: wiring.
        echo "STACK_ID=${STACK_ID}" >> "$GITHUB_ENV"
        echo "stack-id=${STACK_ID}" >> "$GITHUB_OUTPUT"
        echo "Resolved stack identity: ${STACK_ID}"

    - name: Assume role for AWS Account
      uses: bisnow/github-actions-assume-role-for-environment@main
      with:
        aws-account: ${{ inputs.aws-account }}

    - name: Configure kubectl
      shell: bash
      run: |
        aws eks update-kubeconfig --region us-east-1 --name ${{ inputs.eks-cluster }}

    - name: Authenticate Helm with ECR
      shell: bash
      run: |
        # Get ECR login token and configure Helm to use it
        aws ecr get-login-password --region us-east-1 | \
          helm registry login ${{ inputs.ecr-registry }} \
          --username AWS \
          --password-stdin

    - name: Get IAM Role ARN from CloudFormation
      id: get-role-arn
      shell: bash
      run: |
        echo "Querying CloudFormation stack for IAM role ARN..."
        STACK_NAME="${{ inputs.cloudformation-stack-name }}"

        ROLE_ARN=$(aws cloudformation describe-stacks \
          --stack-name "${STACK_NAME}" \
          --query 'Stacks[0].Outputs[?contains(OutputKey, `RoleArn`)].OutputValue' \
          --output text | head -n 1)

        if [ -z "$ROLE_ARN" ]; then
          echo "ERROR: Could not find any output containing 'RoleArn' in CloudFormation stack ${STACK_NAME}"
          echo "Make sure the CloudFormation stack has an output with 'RoleArn' in the key name."
          exit 1
        fi

        echo "role-arn=${ROLE_ARN}" >> $GITHUB_OUTPUT
        echo "Found IAM Role ARN: ${ROLE_ARN}"

    - name: Compute Release Name
      id: release-name
      shell: bash
      env:
        APP_NAME_INPUT: ${{ inputs.app-name }}
      run: |
        set -euo pipefail

        RELEASE_SUFFIX="-pr-${STACK_ID}"
        MAX_APP_LEN=$((53 - ${#RELEASE_SUFFIX}))
        APP_NAME="${APP_NAME_INPUT}"

        if [ ${#APP_NAME} -gt "$MAX_APP_LEN" ]; then
          APP_NAME="${APP_NAME:0:$MAX_APP_LEN}"
          echo "Warning: app-name truncated to ${MAX_APP_LEN} chars to fit Helm 53-char release name limit: ${APP_NAME}"
        fi

        RELEASE_NAME="${APP_NAME}${RELEASE_SUFFIX}"
        echo "release-name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
        echo "Release name: ${RELEASE_NAME}"

    - name: Apply Sealed Secrets
      shell: bash
      env:
        KUSTOMIZATION_PATH: ${{ inputs.kustomization-path }}
        NAMESPACE: ${{ inputs.namespace }}
        SEALED_SECRETS_TIMEOUT: ${{ inputs.sealed-secrets-timeout }}
      run: |
        set -euo pipefail

        if [ ! -f "${KUSTOMIZATION_PATH}/kustomization.yaml" ]; then
          echo "No kustomization.yaml found at ${KUSTOMIZATION_PATH}, skipping sealed secrets..."
          exit 0
        fi

        echo "Applying sealed secrets from ${KUSTOMIZATION_PATH}..."
        kubectl apply -k "${KUSTOMIZATION_PATH}"

        # Enumerate the target Secret names produced by SealedSecret resources in this kustomization.
        # By default a SealedSecret creates a Secret with the same metadata.name; an override can be
        # set via spec.template.metadata.name, which takes precedence when present.
        # yq eval-all emits `---` between documents; strip them so the list contains only names.
        TARGET_SECRETS=$(kubectl kustomize "${KUSTOMIZATION_PATH}" \
          | yq eval-all 'select(.kind == "SealedSecret") | (.spec.template.metadata.name // .metadata.name)' - \
          | grep -v '^---$')

        if [ -z "${TARGET_SECRETS}" ]; then
          echo "No SealedSecret resources found in kustomization — nothing to wait for."
          exit 0
        fi

        echo "Waiting up to ${SEALED_SECRETS_TIMEOUT}s for the sealed-secrets controller to materialize:"
        # shellcheck disable=SC2001
        echo "${TARGET_SECRETS}" | sed 's/^/  - /'

        deadline=$(( $(date +%s) + SEALED_SECRETS_TIMEOUT ))
        while :; do
          missing=()
          for name in ${TARGET_SECRETS}; do
            if ! kubectl get secret -n "${NAMESPACE}" "${name}" >/dev/null 2>&1; then
              missing+=("${name}")
            fi
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo "All sealed secrets decrypted."
            break
          fi

          if [ "$(date +%s)" -ge "${deadline}" ]; then
            echo "::error::Timed out after ${SEALED_SECRETS_TIMEOUT}s waiting for sealed-secrets controller."
            echo "::error::Still missing: ${missing[*]}"
            exit 1
          fi

          sleep 2
        done

    - name: Preflight - Recover Stuck Helm Release
      shell: bash
      env:
        RELEASE_NAME: ${{ steps.release-name.outputs.release-name }}
        NAMESPACE: ${{ inputs.namespace }}
      run: |
        # This step is best-effort: it must never fail the workflow on its own. Any unexpected
        # error just logs and continues so the real deploy still runs (and surfaces the real error).
        set +e

        STATUS_JSON=$(helm status "${RELEASE_NAME}" -n "${NAMESPACE}" -o json 2>/dev/null)
        if [ -z "${STATUS_JSON}" ]; then
          echo "No existing release '${RELEASE_NAME}' in namespace '${NAMESPACE}' — nothing to unstick."
          exit 0
        fi

        STATUS=$(echo "${STATUS_JSON}" | jq -r '.info.status // empty')
        echo "Current release status: ${STATUS:-<unknown>}"

        case "${STATUS}" in
          pending-upgrade|pending-install|pending-rollback)
            echo "::warning::Helm release ${RELEASE_NAME} is stuck in '${STATUS}' — attempting recovery."

            LAST_DEPLOYED_REV=$(helm history "${RELEASE_NAME}" -n "${NAMESPACE}" -o json 2>/dev/null \
              | jq -r '[.[] | select(.status=="deployed")] | sort_by(.revision) | last.revision // empty')

            if [ -n "${LAST_DEPLOYED_REV}" ]; then
              echo "Rolling back to last deployed revision ${LAST_DEPLOYED_REV}..."
              if helm rollback "${RELEASE_NAME}" "${LAST_DEPLOYED_REV}" -n "${NAMESPACE}"; then
                echo "Rollback succeeded."
              else
                echo "::warning::helm rollback failed — continuing; the real deploy will surface the error."
              fi
            else
              echo "No prior deployed revision exists — removing pending-state release secrets."
              for s in pending-upgrade pending-install pending-rollback; do
                kubectl delete secret -n "${NAMESPACE}" \
                  -l "owner=helm,name=${RELEASE_NAME},status=${s}" \
                  --ignore-not-found=true \
                  || echo "::warning::Failed to delete ${s} release secrets — continuing."
              done
            fi
            ;;
          "")
            echo "Could not parse release status; skipping preflight recovery."
            ;;
          *)
            echo "Status '${STATUS}' is not a pending state — no preflight action needed."
            ;;
        esac

        exit 0

    - name: Deploy PR Stack
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        RELEASE_NAME: ${{ steps.release-name.outputs.release-name }}
        NAMESPACE: ${{ inputs.namespace }}
        ECR_REGISTRY: ${{ inputs.ecr-registry }}
        HELM_CHART_VERSION: ${{ inputs.helm-chart-version }}
        VALUES_FILE_PATH: ${{ inputs.values-file-path }}
        ROLE_ARN: ${{ steps.get-role-arn.outputs.role-arn }}
        HELM_SET_VALUES: ${{ inputs.helm-set-values }}
        EXTERNAL_DATABASE_HOST: ${{ inputs.external-database-host }}
        ATOMIC: ${{ inputs.atomic }}
      run: |
        set -euo pipefail

        echo "Deploying stack ${STACK_ID} with image ${IMAGE_TAG}"

        # Build the helm invocation as an argv array so values with spaces are safe
        # and we don't need `eval`.
        helm_args=(
          upgrade --install "${RELEASE_NAME}"
          "oci://${ECR_REGISTRY}/laravel-pr-stack"
          --version "${HELM_CHART_VERSION}"
          --namespace "${NAMESPACE}"
          --values "${VALUES_FILE_PATH}"
          --set "global.prNumber=${STACK_ID}"
          --set "serviceAccount.roleArn=${ROLE_ARN}"
        )

        if [ -n "${IMAGE_TAG}" ]; then
          helm_args+=(--set "image.tag=${IMAGE_TAG}")
        fi

        if [ -n "${HELM_SET_VALUES}" ]; then
          # shellcheck disable=SC2086
          for kv in ${HELM_SET_VALUES}; do
            helm_args+=(--set "${kv}")
          done
        fi

        if [ -n "${EXTERNAL_DATABASE_HOST}" ]; then
          echo "External database enabled, host: ${EXTERNAL_DATABASE_HOST}"
          helm_args+=(
            --set "appConfig.data.DB_HOST=${EXTERNAL_DATABASE_HOST}"
            --set "appConfig.data.DB_READ_HOST=${EXTERNAL_DATABASE_HOST}"
            --set "appConfig.data.DB_WRITE_HOST=${EXTERNAL_DATABASE_HOST}"
            --set "additionalContainersDbHost=${EXTERNAL_DATABASE_HOST}"
          )
        fi

        helm_args+=(--wait --timeout 10m)

        if [ "${ATOMIC}" = "true" ]; then
          # --atomic rolls back a failed upgrade automatically; --cleanup-on-fail removes
          # resources created during the failed attempt. Together they prevent the release
          # from being left in a `pending-upgrade` state that would block the next run.
          helm_args+=(--atomic --cleanup-on-fail)
        fi

        dump_failure_diagnostics() {
          echo "::group::kubectl describe deploy (pr-number=${STACK_ID},app=${APP_NAME})"
          kubectl describe deploy -n "${NAMESPACE}" -l "pr-number=${STACK_ID},app=${APP_NAME}" || true
          echo "::endgroup::"

          echo "::group::Recent events in namespace ${NAMESPACE} (last 100)"
          kubectl get events -n "${NAMESPACE}" --sort-by='.lastTimestamp' 2>/dev/null | tail -100 || true
          echo "::endgroup::"

          echo "::group::Logs from not-ready containers"
          pods=$(kubectl get pod -n "${NAMESPACE}" \
            -l "pr-number=${STACK_ID},app=${APP_NAME}" \
            -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)
          for pod in ${pods}; do
            not_ready=$(kubectl get pod -n "${NAMESPACE}" "${pod}" \
              -o jsonpath='{range .status.containerStatuses[?(@.ready==false)]}{.name}{"\n"}{end}' 2>/dev/null || true)
            for container in ${not_ready}; do
              echo "--- pod=${pod} container=${container} (previous) ---"
              kubectl logs -n "${NAMESPACE}" "${pod}" -c "${container}" --previous --tail=200 2>&1 || true
              echo "--- pod=${pod} container=${container} (current) ---"
              kubectl logs -n "${NAMESPACE}" "${pod}" -c "${container}" --tail=200 2>&1 || true
            done
          done
          echo "::endgroup::"
        }

        set +e
        helm "${helm_args[@]}"
        helm_exit=$?
        set -e

        if [ "${helm_exit}" -ne 0 ]; then
          echo "::error::helm upgrade failed with exit code ${helm_exit} — dumping diagnostics before exiting."
          dump_failure_diagnostics
          exit "${helm_exit}"
        fi

    - name: Get Deployed URL
      id: get-url
      shell: bash
      run: |
        echo "Querying deployed resources for URL..."
        INGRESS_HOST=""

        # 1. Try standard Kubernetes Ingress (chart v1 / ALB)
        INGRESS_HOST=$(kubectl get ingress -n ${{ inputs.namespace }} \
          -l pr-number=${STACK_ID},app=${{ inputs.app-name }} \
          -o jsonpath='{.items[0].spec.rules[0].host}' 2>/dev/null || true)

        # 2. Try Traefik IngressRoute CRD (chart v2)
        if [ -z "$INGRESS_HOST" ]; then
          echo "No standard Ingress found, checking Traefik IngressRoute..."
          INGRESSROUTE_MATCH=$(kubectl get ingressroute -n ${{ inputs.namespace }} \
            -l pr-number=${STACK_ID},app=${{ inputs.app-name }} \
            -o jsonpath='{.items[0].spec.routes[0].match}' 2>/dev/null || true)

          if [ -n "$INGRESSROUTE_MATCH" ]; then
            # Extract hostname from e.g. Host(`bridge-pr-71.non-prod.bisnow.cloud`)
            INGRESS_HOST=$(echo "$INGRESSROUTE_MATCH" | sed "s/[^\`]*\`\([^\`]*\)\`.*/\1/")
            echo "Found IngressRoute host: ${INGRESS_HOST}"
          fi
        fi

        # 3. Fall back to constructed URL based on naming convention
        URL_ESTIMATED=false
        if [ -z "$INGRESS_HOST" ]; then
          echo "WARNING: Could not find Ingress or IngressRoute for app=${{ inputs.app-name }} stack ${STACK_ID}"
          echo "Falling back to estimated URL based on naming convention."
          INGRESS_HOST="${{ inputs.app-name }}-pr-${STACK_ID}.non-prod.bisnow.cloud"
          echo "Estimated URL (may not reflect actual routing): https://${INGRESS_HOST}"
          URL_ESTIMATED=true
        fi

        APP_URL="https://${INGRESS_HOST}"
        echo "app-url=${APP_URL}" >> $GITHUB_OUTPUT
        echo "url-estimated=${URL_ESTIMATED}" >> $GITHUB_OUTPUT
        echo "Deployed URL: ${APP_URL}"

    - name: Find Ready Pod
      id: ready-pod
      if: inputs.skip-connection-tests != 'true'
      shell: bash
      run: |
        # A just-finished rollout can leave the previous pod Terminating, and
        # `.items[0]` can select it — `kubectl exec` then fails with
        # "container not found". Pick the newest pod that is actually Ready,
        # retrying while the rollout settles.
        for i in $(seq 1 60); do
          POD=$(kubectl get pod -n ${{ inputs.namespace }} \
            -l pr-number=${STACK_ID},app=${{ inputs.app-name }} \
            --sort-by=.metadata.creationTimestamp \
            -o jsonpath='{range .items[*]}{.metadata.name} {.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
            | awk '$2 == "True" { name = $1 } END { print name }')
          if [ -n "${POD}" ]; then
            break
          fi
          echo "No ready pod yet (attempt ${i}/60)..."
          sleep 5
        done

        if [ -z "${POD}" ]; then
          echo "::error::No ready ${{ inputs.app-name }} pod found for stack ${STACK_ID}"
          exit 1
        fi

        echo "pod=${POD}" >> $GITHUB_OUTPUT
        echo "Using pod ${POD}"

    - name: Test Database Connection
      if: inputs.skip-connection-tests != 'true'
      shell: bash
      run: |
        POD=${{ steps.ready-pod.outputs.pod }}

        echo "Testing database connection..."
        kubectl exec -n ${{ inputs.namespace }} ${POD} -c web -- php artisan tinker --execute="
        try {
            DB::connection()->getPdo();
            echo 'DB: Connected\n';
        } catch (Exception \$e) {
            echo 'DB: ' . \$e->getMessage() . '\n';
            exit(1);
        }
        "

    - name: Test Redis Connection
      if: inputs.skip-connection-tests != 'true' && inputs.skip-redis-test != 'true'
      shell: bash
      run: |
        POD=${{ steps.ready-pod.outputs.pod }}

        echo "Testing Redis connection..."
        kubectl exec -n ${{ inputs.namespace }} ${POD} -c web -- php artisan tinker --execute="
        try {
            Cache::put('test', 'ok', 5);
            if (Cache::get('test') !== 'ok') { echo 'Redis: Failed\n'; exit(1); }
            echo 'Redis: Connected\n';
        } catch (Exception \$e) {
            echo 'Redis: ' . \$e->getMessage() . '\n';
            exit(1);
        }
        "

    - name: Generate GitHub App Token
      id: app-token
      if: inputs.app-id != '' && inputs.private-key != ''
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}

    - name: Post PR Comment
      # Only when we have a real PR to comment on — dev stacks pass no pr-number.
      if: steps.app-token.outputs.token != '' && inputs.pr-number != ''
      uses: actions/github-script@v8
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        script: |
          const marker = '<!-- pr-stack-deployed -->';
          const prNumber = parseInt('${{ inputs.pr-number }}');
          const url = '${{ steps.get-url.outputs.app-url }}';
          const body = [
            marker,
            '**PR Stack Deployed**',
            '',
            `**URL:** ${url}`,
          ].join('\n');

          console.log(`Posting comment to repo: ${JSON.stringify(context.repo)}, PR #${prNumber}`);

          const { data: comments } = await github.rest.issues.listComments({
            ...context.repo,
            issue_number: prNumber,
          });

          console.log(`Found ${comments.length} existing comments`);

          const existing = comments.find(c => c.body.includes(marker));
          if (existing) {
            console.log(`Updating existing comment ${existing.id}`);
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: existing.id,
              body,
            });
            console.log('Comment updated');
          } else {
            console.log('Creating new comment');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body,
            });
            console.log('Comment created');
          }

    - name: Output Summary
      shell: bash
      run: |
        echo "## PR Environment Deployed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.get-url.outputs.url-estimated }}" = "true" ]; then
          echo "> [!WARNING]" >> $GITHUB_STEP_SUMMARY
          echo "> Could not find an Ingress or IngressRoute for **${{ inputs.app-name }}** stack \`${STACK_ID}\`. The URL below is estimated from the naming convention and may not be correct." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        echo "**URL:** ${{ steps.get-url.outputs.app-url }}" >> $GITHUB_STEP_SUMMARY
        IMAGE_TAG="${{ inputs.image-tag }}"
        if [ -z "$IMAGE_TAG" ]; then
          IMAGE_TAG=$(yq '.image.tag' ${{ inputs.values-file-path }})
        fi
        echo "**Image:** \`${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
        if [ -n "${{ inputs.external-database-host }}" ]; then
          echo "**Database:** \`${{ inputs.external-database-host }}\`" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Status" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        kubectl get pod -n ${{ inputs.namespace }} -l pr-number=${STACK_ID},app=${{ inputs.app-name }} >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
